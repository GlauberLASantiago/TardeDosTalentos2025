<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarde de Talentos - Igreja Presbiteriana Filadélfia</title>
    <style>
        /* Define as cores da paleta ENEC como variáveis CSS para fácil reutilização */
        :root {
            --cor-primaria: #1E40FB;
            --cor-secundaria: #FC0019;
            --cor-acento: #FECF2F;
            --cor-destaque: #1FD025;
            --cor-escura: #434344;
            --cor-clara: #F9F9F9;
            --cor-sombra: rgba(0, 0, 0, 0.1);
        }

        /* Estilos gerais para o corpo da página */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #183E0C; /* Fundo de página modificado */
            color: #F0F0F0; /* Cor de texto principal ajustada para o fundo escuro */
            overflow-x: hidden; /* Evita rolagem horizontal */
        }

        /* Container principal para centralizar o conteúdo */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Estilo do cabeçalho */
        header {
            text-align: center;
            margin-bottom: 60px;
            /* Animação de entrada */
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUP 0.8s ease-out forwards;
        }

        header h1 {
            font-size: 3rem;
            color: var(--cor-clara); /* Garante que o título seja claro */
            margin: 0;
        }

        header p {
            font-size: 1.2rem;
            color: #cccccc; /* Cor ajustada para melhor contraste */
            margin-top: 10px;
        }

        /* Seção de detalhes do evento */
        .detalhes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            text-align: center;
            margin-bottom: 60px;
        }

        .detalhe-item {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px var(--cor-sombra);
            color: var(--cor-escura); /* Garante que o texto dentro dos cards seja escuro */
            /* Animação de entrada (será controlada por JS) */
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            /* Adicionado para centralizar o conteúdo verticalmente */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100px; /* Garante altura mínima para alinhamento */
        }

        .detalhe-item.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .detalhe-item span {
            font-size: 2rem;
            display: block;
            margin-bottom: 10px;
        }

        /* Título da seção de programação */
        .titulo-secao {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            position: relative;
            padding-bottom: 10px;
        }

        /* Linha decorativa abaixo do título */
        .titulo-secao::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background-color: var(--cor-primaria);
            border-radius: 2px;
        }
        
        /* Lista da programação */
        .lista-programa {
            list-style: none;
            padding: 0;
        }

        .item-programa {
            background-color: #ffffff;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px var(--cor-sombra);
            display: flex;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden; /* Para a linha lateral */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            color: var(--cor-escura); /* Garante que o texto dentro dos cards seja escuro */
            /* Animação de entrada (será controlada por JS) */
            opacity: 0;
            transform: translateX(30px);
        }
        
        .item-programa.is-visible {
            opacity: 1;
            transform: translateX(0);
        }

        /* Efeito de hover nos itens da lista */
        .item-programa:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(30, 64, 251, 0.2);
        }

        /* Linha colorida na lateral do card */
        .item-programa::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 10px;
            height: 100%;
            /* As cores são definidas inline no HTML para variar */
        }
        
        .item-programa .conteudo {
            flex-grow: 1;
            padding-left: 20px;
        }

        .item-programa .titulo {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--cor-secundaria);
            margin: 0 0 5px 0;
        }
        
        .item-programa .participantes {
            font-size: 0.9rem;
            color: var(--cor-escura);
        }

        .item-programa .duracao {
            font-style: italic;
            font-size: 1rem;
            margin-left: 20px;
            white-space: nowrap; /* Impede que o texto quebre */
        }

        /* Estilo do rodapé */
        footer {
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
            background-color: var(--cor-escura);
            color: var(--cor-clara);
            font-size: 0.9rem;
        }

        /* Animação de Fade In e Subida */
        @keyframes fadeInUP {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Tarde de Talentos 2025</h1>
            <p>Igreja Presbiteriana Filadélfia de São Carlos</p>
        </header>

        <section class="detalhes">
            <div class="detalhe-item">
                <p>11/10</p>
            </div>
            <div class="detalhe-item">
                <p>Salão Social da Igreja</p>
            </div>
            <div class="detalhe-item">
                <span>⏱️</span>
                <p>Duração: 90 minutos</p>
            </div>
            <div class="detalhe-item">
                <span>🎤</span>
                <p>Apresentador: Glauber Santiago</p>
            </div>
        </section>

        <main>
            <h2 class="titulo-secao">Programação</h2>
            <ul class="lista-programa">
                <!-- Os itens da programação serão inseridos aqui pelo JavaScript -->
            </ul>
        </main>
    </div>

    <footer>
        <p>Página formatada por IA baseada em um texto enviado pelo usuário.</p>
        <p>Gerado em <span id="generationDate"></span>.</p>
    </footer>

    <script>
        // --- Dados do Evento ---
        const eventData = {
            program: [
                { id: 1, title: 'Cantarei', duration: 5, participants: 'Lide, Paulo Ricardo, João Pedro' },
                { id: 2, title: 'Apresentação de Violinos', duration: 4, participants: 'Sophie Tassi e Estela Diniz' },
                { id: 3, title: 'Dueto de Violinos', duration: 4, participants: 'Henrique Santos e Sophie Tassi' },
                { id: 4, title: 'Turma de Violinos da Escola de Música', duration: 3, participants: 'Ângela Matheus, Evani Machado, Davi Neves, Elizabeth Santiago, Estela Diniz' },
                { id: 5, title: 'Dupla Fênix', duration: 3, participants: 'Paulo Ricardo e João Pedro' },
                { id: 6, title: 'Gênesis à Paulo', duration: 5, participants: 'Paulo Ricardo, Abner Diniz, Estela Diniz, Estevão Diniz e Glauber Santiago' },
                { id: 7, title: 'Imagens e Versos desse Universo', duration: 3, participants: 'Ciro Cellurale' },
                { id: 8, title: 'Dueto no Piano', duration: 5, participants: 'Pedro Theodoro e Henrique Bianchi' },
                { id: 9, title: 'Crer e Observar', duration: 1, participants: 'Henrique Bianchi' },
                { id: 10, title: 'Xilofonando', duration: 2, participants: 'Maria Eliza' },
                { id: 11, title: 'Vitrola Falante', duration: 4, participants: 'Davi Neves' },
                { id: 12, title: 'Rúach Elohím', duration: 5, participants: 'Gidenilson Santiago e Glauber Santiago' },
                { id: 13, title: 'Teus Altares', duration: 4, participants: 'Gidenilson Santiago' },
                { id: 14, title: 'Guitarra Hawaiana Blues', duration: 2, participants: 'Glauber Santiago' },
                { id: 15, title: 'Palestra', duration: 5, participants: 'Deise Pádua Silva' },
                { id: 16, title: 'Cantar', duration: 5, participants: 'Karen de Souza' },
                { id: 17, title: 'Lotação Máxima', duration: 5, participants: 'Paulo, Estevão, Abner, Estela, Sophie, Samuell, João, Lucas Carvalho' },
                { id: 18, title: 'Batman e Robin', duration: 5, participants: 'Estevão Diniz e Arthur Diniz' },
                { id: 19, title: 'Família Luchnos', duration: 5, participants: 'Priscila, Estevão, Abner, Estela, Ariela, Arthur (todos Diniz)' },
                { id: 20, title: 'Sr. Arlindo', duration: 5, participants: 'Arlindo Pinguieri' }
            ],
            colors: ['var(--cor-primaria)', 'var(--cor-secundaria)', 'var(--cor-acento)', 'var(--cor-destaque)']
        };
        
        // --- Função para popular a lista da programação ---
        function populateProgramList() {
            const list = document.querySelector('.lista-programa');
            if (!list) return;

            eventData.program.forEach((item, index) => {
                // Cria o elemento <li>
                const listItem = document.createElement('li');
                listItem.className = 'item-programa';
                
                // Define a cor da borda lateral, alternando entre as cores da paleta
                const color = eventData.colors[index % eventData.colors.length];
                listItem.style.setProperty('--item-color', color);
                listItem.style.borderLeft = `10px solid ${color}`;

                // Cria o conteúdo interno do card
                listItem.innerHTML = `
                    <div class="conteudo">
                        <h3 class="titulo">${item.id}. ${item.title}</h3>
                        <p class="participantes">${item.participants}</p>
                    </div>
                    <div class="duracao">${item.duration} min</div>
                `;
                
                list.appendChild(listItem);
            });
        }
        
        // --- Lógica para animação ao rolar a página ---
        function setupScrollAnimations() {
            // Seleciona todos os elementos que devem ser animados
            const animatedElements = document.querySelectorAll('.item-programa, .detalhe-item');

            // Cria um "observador" que vai monitorar quando os elementos entram na tela
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    // Se o elemento estiver visível na tela
                    if (entry.isIntersecting) {
                        // Adiciona a classe 'is-visible' para ativar a animação CSS
                        entry.target.classList.add('is-visible');
                        // Para de observar o elemento para não animar novamente
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.1 // A animação começa quando 10% do elemento estiver visível
            });

            // Pede ao observador para monitorar cada elemento selecionado
            animatedElements.forEach(el => {
                observer.observe(el);
            });
        }

        // --- Função para definir a data de geração no rodapé ---
        function setGenerationDate() {
            const dateElement = document.getElementById('generationDate');
            if(dateElement) {
                const today = new Date();
                dateElement.textContent = today.toLocaleDateString('pt-BR', {
                    day: '2-digit',
                    month: 'long',
                    year: 'numeric'
                });
            }
        }
        
        // --- Executa as funções quando o documento estiver pronto ---
        document.addEventListener('DOMContentLoaded', () => {
            populateProgramList();
            setGenerationDate();
            setupScrollAnimations();
        });

    </script>
</body>
</html>
